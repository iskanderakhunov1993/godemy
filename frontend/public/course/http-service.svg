<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Цикл HTTP-сервиса</title>
  <desc id="desc">Запрос приходит в маршрут, обрабатывается handler и возвращается в виде JSON.</desc>
  <rect width="960" height="360" rx="32" fill="#09111f"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <path d="M160 180h150m180 0h150m180 0h70" fill="none" stroke="#334155" stroke-width="5"/>
    <g>
      <circle cx="120" cy="180" r="62" fill="#112238" stroke="#22d3ee" stroke-width="3"/>
      <text x="120" y="176" fill="#fff" font-size="21" font-weight="700">GET</text>
      <text x="120" y="202" fill="#94a3b8" font-size="14">/weather</text>
    </g>
    <g>
      <rect x="310" y="118" width="180" height="124" rx="24" fill="#171b38" stroke="#8b5cf6" stroke-width="3"/>
      <text x="400" y="176" fill="#fff" font-size="21" font-weight="700">Router</text>
      <text x="400" y="202" fill="#94a3b8" font-size="14">Выбирает handler</text>
    </g>
    <g>
      <rect x="640" y="118" width="180" height="124" rx="24" fill="#112d2a" stroke="#34d399" stroke-width="3"/>
      <text x="730" y="176" fill="#fff" font-size="21" font-weight="700">Handler</text>
      <text x="730" y="202" fill="#94a3b8" font-size="14">Готовит JSON</text>
    </g>
    <text x="885" y="176" fill="#fbbf24" font-size="21" font-weight="700">200</text>
    <text x="885" y="202" fill="#94a3b8" font-size="14">response</text>
  </g>
</svg>
