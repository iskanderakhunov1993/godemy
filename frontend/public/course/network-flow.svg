<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Путь сетевого запроса</title>
  <desc id="desc">Клиент узнаёт IP через DNS, подключается к порту сервера и получает ответ.</desc>
  <rect width="960" height="360" rx="32" fill="#09111f"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#111c30" stroke-width="3">
      <rect x="50" y="105" width="170" height="150" rx="26" stroke="#22d3ee"/>
      <rect x="285" y="105" width="170" height="150" rx="26" stroke="#8b5cf6"/>
      <rect x="520" y="105" width="170" height="150" rx="26" stroke="#34d399"/>
      <rect x="755" y="105" width="155" height="150" rx="26" stroke="#f59e0b"/>
    </g>
    <g fill="#fff" font-size="24" font-weight="700">
      <text x="135" y="175">Клиент</text>
      <text x="370" y="175">DNS</text>
      <text x="605" y="175">IP</text>
      <text x="832" y="175">:8080</text>
    </g>
    <g fill="#94a3b8" font-size="15">
      <text x="135" y="207">Нужен сервис</text>
      <text x="370" y="207">Ищет адрес</text>
      <text x="605" y="207">Находит сервер</text>
      <text x="832" y="207">Выбирает процесс</text>
    </g>
    <g fill="none" stroke="#475569" stroke-width="4">
      <path d="M220 180h65m170 0h65m170 0h65"/>
    </g>
  </g>
</svg>
