global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Golanger backend (example) - adjust host if running in Docker
  - job_name: 'golanger-backend'
    static_configs:
      - targets: ['backend:8080']
    metrics_path: /metrics
    scheme: http
