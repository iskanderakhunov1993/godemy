name: Deploy to Staging

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging server
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
          SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          
          # Validate required secrets
          [[ -n "$DEPLOY_HOST" ]] || { echo "❌ STAGING_DEPLOY_HOST is not set"; exit 1; }
          [[ -n "$DEPLOY_PATH" ]] || { echo "❌ STAGING_DEPLOY_PATH is not set"; exit 1; }
          [[ -n "$SSH_KEY" ]] || { echo "❌ STAGING_SSH_PRIVATE_KEY is not set"; exit 1; }
          
          # Setup SSH
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          
          # Deploy
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new root@"$DEPLOY_HOST" <<'EOF'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          git fetch origin
          git checkout develop
          git reset --hard origin/develop
          chmod +x scripts/deploy-staging.sh
          APP_DIR="$DEPLOY_PATH" ./scripts/deploy-staging.sh
EOF
          
          echo "✓ Staging deployment completed"
