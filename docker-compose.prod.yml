services:
  db:
    image: mirror.gcr.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-golanger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-golanger}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-golanger}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - APP_ENV=production
      - PORT=8080
      - DATABASE_URL=host=db user=${POSTGRES_USER:-golanger} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB:-golanger} port=5432 sslmode=disable
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_LOGIN=${ADMIN_LOGIN}
      - ADMIN_SECRET=${ADMIN_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - FRONTEND_URL=${FRONTEND_URL}
      - YANDEX_CLIENT_ID=${YANDEX_CLIENT_ID:-}
      - YANDEX_CLIENT_SECRET=${YANDEX_CLIENT_SECRET:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SANDBOX_MODE=docker
      - RUNNER_IMAGE=golanger-runner:latest
      - SANDBOX_CPUS=${SANDBOX_CPUS:-0.50}
      - SANDBOX_MEMORY=${SANDBOX_MEMORY:-256m}
      - SANDBOX_PIDS_LIMIT=${SANDBOX_PIDS_LIMIT:-64}
    volumes:
      - uploads-data:/app/uploads
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  runner-image:
    build:
      context: ./docker/runner
      dockerfile: Dockerfile
    image: golanger-runner:latest
    profiles:
      - runner-build

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-}
    depends_on:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  nginx:
    image: mirror.gcr.io/library/nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d/golanger.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  certbot:
    image: mirror.gcr.io/certbot/certbot:v2.11.0
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done"
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  postgres-data:
  uploads-data:
  certbot-www:
  certbot-conf:
