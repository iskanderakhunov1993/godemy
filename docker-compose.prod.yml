services:
  db:
    image: postgres:16-alpine
    container_name: golanger-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-golanger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-golanger}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-golanger}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: golanger-backend
    env_file:
      - ./backend/.env.production
    environment:
      - PORT=8080
      - DATABASE_URL=host=db user=${POSTGRES_USER:-golanger} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB:-golanger} port=5432 sslmode=disable
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: golanger-frontend
    env_file:
      - ./frontend/.env.production
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: golanger-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d/golanger.conf:/etc/nginx/conf.d/golanger.conf:ro
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  certbot:
    image: certbot/certbot:v2.11.0
    container_name: golanger-certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done"
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  postgres-data:
  uploads-data:
  certbot-www:
  certbot-conf:
